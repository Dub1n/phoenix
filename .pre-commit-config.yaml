repos:
  - repo: local
    hooks:
      - id: generate-context-index
        name: generate context index
        entry: bash
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        args:
          - -c
          - |
            set -euo pipefail
            if command -v python3 >/dev/null 2>&1; then
              python3 scripts/IDE-manager/generate-context-index.py
            else
              python scripts/IDE-manager/generate-context-index.py
            fi
